name: IG Trend Scout
on:
  push:
    paths: ['cloud/trend_nudge.txt']
  schedule:
    - cron: '30 10 * * *'   # 07:30 Brasília
    - cron: '50 10 * * *'   # retry 07:50
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pauta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trava anti-duplicata (pula se a pauta de hoje ja saiu)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOJE=$(TZ=America/Sao_Paulo date +%d/%m/%Y)
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "done=false" >> $GITHUB_OUTPUT; exit 0; fi
          if gh issue list --repo "${{ github.repository }}" --state all --limit 10 --json title -q '.[].title' | grep "Pauta do dia" | grep -q "$HOJE"; then
            echo "done=true" >> $GITHUB_OUTPUT
          else
            echo "done=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.done != 'true'
        with:
          python-version: '3.12'
      - name: Gerar pauta
        if: steps.guard.outputs.done != 'true'
        run: python cloud/trend.py
      - name: Abrir issue com a pauta (-> e-mail)
        if: steps.guard.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "" >> cloud/pauta.md
          echo "cc @osantosiqueira96" >> cloud/pauta.md
          gh issue create --assignee "osantosiqueira96" --repo "${{ github.repository }}" \
            --title "🗞️ Pauta do dia — $(TZ=America/Sao_Paulo date +%d/%m/%Y)" \
            --body-file cloud/pauta.md
      - name: Andon — alerta de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --assignee "osantosiqueira96" --repo "${{ github.repository }}" \
            --title "🚨 ANDON trend-scout falhou — $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')" \
            --body "Ver logs da execução ${{ github.run_id }}."
