name: IG Content Factory
on:
  push:
    paths: ['factory/spec-*.json', 'factory/nudge.txt']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar playwright + chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Renderizar specs
        run: python cloud/factory.py
      - name: Commit (posts + fila + specs processadas)
        run: |
          git config user.name "ig-factory"
          git config user.email "ig-bot@users.noreply.github.com"
          git add -A cloud/posts cloud/queue.json factory
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git commit -m "factory: conteudo renderizado"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push && exit 0
            sleep 4
          done
          exit 1
      - name: Andon — alerta de falha
        if: failure() || hashFiles('cloud/_alert.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="Ver logs da execução ${{ github.run_id }}."
          if [ -f cloud/_alert.txt ]; then BODY=$(cat cloud/_alert.txt); fi
          gh issue create --assignee "osantosiqueira96" --repo "${{ github.repository }}" \
            --title "🚨 ANDON content-factory — $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')" \
            --body "$BODY"
