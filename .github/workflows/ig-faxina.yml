name: IG Faxina
on:
  push:
    paths: ['cloud/faxina_nudge.txt']
  schedule:
    - cron: '0 6 * * 0'    # domingo 03:00 Brasília
  workflow_dispatch:
    inputs:
      dias:
        description: 'Arquivar publicados ha mais de N dias'
        default: '30'
      dry:
        description: 'Simular sem apagar (1 = sim)'
        default: '0'

permissions:
  contents: write
  issues: write

jobs:
  faxina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Arquivar midia antiga
        env:
          DIAS: ${{ github.event.inputs.dias || '30' }}
          DRY: ${{ github.event.inputs.dry || '0' }}
        run: python cloud/faxina.py
      - name: Commit
        run: |
          git config user.name "ig-faxina"
          git config user.email "ig-bot@users.noreply.github.com"
          git add -A cloud/posts cloud/queue.json
          if git diff --cached --quiet; then echo "nada a arquivar"; exit 0; fi
          git commit -m "faxina: midia antiga arquivada [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push && exit 0
            sleep 4
          done
          exit 1
      - name: Avisar o que foi arquivado
        if: hashFiles('cloud/_faxina.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "" >> cloud/_faxina.txt
          echo "cc @osantosiqueira96" >> cloud/_faxina.txt
          gh issue create --assignee "osantosiqueira96" --repo "${{ github.repository }}" \
            --title "🧹 Faxina — $(TZ=America/Sao_Paulo date +%d/%m/%Y)" \
            --body-file cloud/_faxina.txt
      - name: Andon — alerta de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --assignee "osantosiqueira96" --repo "${{ github.repository }}" \
            --title "🚨 ANDON faxina falhou — $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')" \
            --body "Ver logs da execução ${{ github.run_id }}."
