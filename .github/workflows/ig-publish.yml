name: IG Publish
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'cloud/queue.json'
      - 'cloud/posts/**'

permissions:
  contents: write
  issues: write

concurrency:
  group: ig-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Publicar vencidos
        id: pub
        run: python cloud/publish.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      - name: Commit queue atualizada
        if: always()
        run: |
          git config user.name "ig-bot"
          git config user.email "ig-bot@users.noreply.github.com"
          git add cloud/queue.json
          if git diff --cached --quiet; then
            echo "sem mudanças na fila — nada a commitar"
            exit 0
          fi
          git commit -m "queue: status update [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push && exit 0
            echo "retry $i..."; sleep 4
          done
          exit 1
      - name: Andon — alerta de falha (issue -> e-mail)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.pub.outcome }}" = "failure" ] || [ -f cloud/_alert.txt ]; then
            DET="robo falhou antes de publicar"
            [ -f cloud/_alert.txt ] && DET=$(tr '\n' ' | ' < cloud/_alert.txt)
            gh issue create --repo "${{ github.repository }}" \
              --title "🔴 ANDON: falha na publicação automática" \
              --body "Detalhe: $DET — Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "sem falhas — andon quieto"
          fi
