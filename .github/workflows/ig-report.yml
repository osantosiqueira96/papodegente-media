name: IG Daily Report
on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = ~21:00 Brasília
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Gerar relatório
        run: python cloud/report.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Commit metrics.json (fonte do dashboard)
        run: |
          git config user.name "ig-bot"
          git config user.email "ig-bot@users.noreply.github.com"
          git add cloud/metrics.json
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "metrics: snapshot diário [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push && exit 0
            sleep 4
          done
          exit 1
      - name: Abrir issue com o relatório (-> e-mail)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "📰 Relatório diário @papodegentebr — $(TZ=America/Sao_Paulo date +%d/%m/%Y)" \
            --body-file cloud/report.md
