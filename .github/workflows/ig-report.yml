name: IG Daily Report
on:
  push:
    paths: ['cloud/report_nudge.txt']
  schedule:
    - cron: '0 11 * * *'    # 08:00 Brasília
    - cron: '20 11 * * *'   # retry 08:20
    - cron: '40 11 * * *'   # retry 08:40
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trava anti-duplicata (pula se ja saiu hoje)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOJE=$(TZ=America/Sao_Paulo date +%d/%m/%Y)
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "done=false" >> $GITHUB_OUTPUT; exit 0; fi
          if gh issue list --repo "${{ github.repository }}" --state all --limit 10 --json title -q '.[].title' | grep -q "$HOJE"; then
            echo "done=true" >> $GITHUB_OUTPUT
          else
            echo "done=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.done != 'true'
        with:
          python-version: '3.12'
      - run: pip install requests
        if: steps.guard.outputs.done != 'true'
      - name: Gerar relatório
        if: steps.guard.outputs.done != 'true'
        run: python cloud/report.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Commit metrics.json (fonte do dashboard)
        if: steps.guard.outputs.done != 'true'
        run: |
          git config user.name "ig-bot"
          git config user.email "ig-bot@users.noreply.github.com"
          git add cloud/metrics.json
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "metrics: snapshot diário [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push && exit 0
            sleep 4
          done
          exit 1
      - name: Abrir issue com o relatório (-> e-mail)
        if: steps.guard.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "📰 Relatório diário @papodegentebr — $(TZ=America/Sao_Paulo date +%d/%m/%Y)" \
            --body-file cloud/report.md
