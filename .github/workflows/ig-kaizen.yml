name: IG Kaizen
on:
  push:
    paths: ['cloud/kaizen_nudge.txt']
  schedule:
    - cron: '0 1 * * *'    # 22:00 Brasília
    - cron: '20 1 * * *'   # retry 22:20
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  kaizen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rodar o ciclo kaizen
        env:
          GH_TOKEN: ${{ github.token }}
        run: python cloud/kaizen.py
      - name: Commit memoria do ciclo
        run: |
          git config user.name "ig-kaizen"
          git config user.email "ig-bot@users.noreply.github.com"
          git add cloud/kaizen.json cloud/kaizen.md 2>/dev/null || true
          if git diff --cached --quiet; then echo "sem novidade"; exit 0; fi
          git commit -m "kaizen: ciclo do dia [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push && exit 0
            sleep 4
          done
          exit 1
      - name: Abrir issue do ciclo (-> e-mail)
        if: hashFiles('cloud/kaizen.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "" >> cloud/kaizen.md
          echo "cc @osantosiqueira96" >> cloud/kaizen.md
          gh issue create --assignee "osantosiqueira96" --repo "${{ github.repository }}" \
            --title "♻️ Ciclo Kaizen — $(TZ=America/Sao_Paulo date +%d/%m/%Y)" \
            --body-file cloud/kaizen.md
          rm -f cloud/kaizen.md
      - name: Andon — alerta de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --assignee "osantosiqueira96" --repo "${{ github.repository }}" \
            --title "🚨 ANDON agente-kaizen falhou — $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')" \
            --body "Ver logs da execução ${{ github.run_id }}."
