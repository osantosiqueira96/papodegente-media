name: IG Story Poster
on:
  push:
    paths: ['cloud/story_nudge.txt']
  schedule:
    - cron: '30 20 * * *'   # 17:30 Brasília
    - cron: '50 20 * * *'   # retry
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Postar story do melhor post
        run: python cloud/story.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Commit estado
        if: always()
        run: |
          git config user.name "ig-story"; git config user.email "ig-bot@users.noreply.github.com"
          git add cloud/story_state.json
          git diff --cached --quiet || git commit -m "story: estado [skip ci]"
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push && break || sleep 4; done
      - name: Andon
        if: failure()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh issue create --assignee "osantosiqueira96" --repo "${{ github.repository }}" --title "🚨 ANDON story-poster falhou" --body "run ${{ github.run_id }}"
