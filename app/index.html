<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#150925">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PG Central</title>
<style>
:root{--bg0:#150925;--bg1:#241042;--card:#2b1550;--card2:#231043;--line:#3d2266;--ink:#F3EDFA;--ink2:#B8A6D9;--lav:#A374FF;--gold:#FFD100;--ok:#4ade80;--run:#60a5fa;--warn:#f87171}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 20% 0%,var(--bg1),var(--bg0) 70%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
header .pg{background:var(--gold);color:#261442;border-radius:10px;padding:2px 10px;font-weight:900;font-size:18px}
header h1{font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
header .sub{font-size:10.5px;color:var(--ink2);margin-left:auto;text-align:right}
nav{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto}
nav button{flex:1;min-width:86px;background:var(--card2);border:1px solid var(--line);color:var(--ink2);border-radius:12px;padding:9px 6px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--gold);color:#261442;border-color:var(--gold)}
main{flex:1;overflow:hidden;position:relative}
.pane{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pane.on{display:block}
iframe{width:100%;height:100%;border:0}
/* visao */
.v{padding:14px 14px 40px;max-width:820px;margin:0 auto}
.north{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:13px}
.stat .n{font-family:ui-monospace,Consolas,monospace;font-size:32px;font-weight:800;line-height:1}
.stat .n.gold{color:var(--gold)}
.stat .l{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink2);margin-top:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--lav);font-weight:800;margin-bottom:10px}
.item{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border:none}
.item .q{font-family:ui-monospace,monospace;color:var(--gold);white-space:nowrap}
.chip{font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:800;padding:2px 8px;border-radius:99px;white-space:nowrap}
.chip.ok{background:rgba(74,222,128,.13);color:var(--ok)}
.chip.run{background:rgba(96,165,250,.13);color:var(--run)}
.bots{display:flex;flex-wrap:wrap;gap:6px}
.bots span{font-size:11px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--ink2)}
.bots span.on{border-color:rgba(74,222,128,.5);color:var(--ok)}
/* diario */
.d{padding:14px;max-width:820px;margin:0 auto}
.issue{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;font-size:13.5px;line-height:1.55}
.issue h3{color:var(--gold);font-size:15px;margin-bottom:8px}
.issue h4{color:var(--lav);font-size:12px;letter-spacing:1px;text-transform:uppercase;margin:12px 0 6px}
.issue pre{background:#0d0618;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;overflow-x:auto;white-space:pre-wrap;margin:8px 0}
.issue a{color:var(--lav)}
.issue b{color:var(--gold)}
.loading{color:var(--ink2);text-align:center;padding:40px}
.bots span{cursor:pointer}
.bots span:active{transform:scale(.96)}
.modal-bg{position:fixed;inset:0;background:rgba(10,4,24,.75);backdrop-filter:blur(3px);display:none;z-index:50;align-items:flex-end;justify-content:center}
.modal-bg.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px 26px;width:100%;max-width:560px;max-height:75vh;overflow-y:auto}
@media(min-width:600px){.modal-bg.on{align-items:center}.modal{border-radius:18px}}
.modal h3{color:var(--gold);font-size:15px;margin-bottom:2px}
.modal .desc{font-size:11.5px;color:var(--ink2);margin-bottom:12px}
.mrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line)}
.mrow:last-child{border:none}
.mrow .k{color:var(--ink2);font-size:11px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.mrow .v{text-align:right;word-break:break-word}
.v.ok{color:var(--ok)} .v.bad{color:var(--warn)} .v.gold{color:var(--gold)}
.mfire{margin-top:12px;width:100%;background:var(--gold);color:#261442;border:none;border-radius:12px;padding:12px;font-weight:900;font-size:13px;letter-spacing:.5px;cursor:pointer;text-transform:uppercase}
.mfire:disabled{opacity:.55;cursor:default}
.mnote{font-size:11px;color:var(--ink2);margin-top:8px;text-align:center}
.mclose{margin-top:14px;width:100%;background:var(--card2);border:1px solid var(--line);color:var(--ink2);border-radius:12px;padding:10px;font-weight:800;cursor:pointer}

</style>
</head>
<body>
<header>
  <span class="pg">PG</span><h1>Central</h1>
  <div class="sub">@papodegentebr<br><span id="hdr">carregando...</span></div>
</header>
<nav>
  <button class="on" data-t="visao">📊 Visão</button>
  <button data-t="previews">🖼️ Previews</button>
  <button data-t="flows">💬 Flows</button>
  <button data-t="diario">🗞️ Diário</button>
</nav>
<main>
  <section class="pane on" id="p-visao"><div class="v" id="visao"><div class="loading">carregando números da nuvem...</div></div></section>
  <section class="pane" id="p-previews"></section>
  <section class="pane" id="p-flows"></section>
  <section class="pane" id="p-diario"><div class="d" id="diario"><div class="loading">carregando pauta e relatórios...</div></div></section>
</main>
<div class="modal-bg" id="mbg" onclick="if(event.target===this)this.classList.remove('on')"><div class="modal" id="mbox"></div></div>
<script>
const RAW="https://raw.githubusercontent.com/osantosiqueira96/papodegente-media/main";
const API="https://api.github.com/repos/osantosiqueira96/papodegente-media";
const lazy={previews:"../previews/",flows:"../flows/"};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".pane").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  const t=b.dataset.t;
  document.getElementById("p-"+t).classList.add("on");
  if(lazy[t]){ const p=document.getElementById("p-"+t);
    if(!p.querySelector("iframe")){ const f=document.createElement("iframe"); f.src=lazy[t]; p.appendChild(f); } }
});
function md(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/```([\s\S]*?)```/g,(m,c)=>`<pre>${c.trim()}</pre>`)
    .replace(/^### (.*)$/gm,"<h4>$1</h4>").replace(/^## (.*)$/gm,"<h4>$1</h4>").replace(/^# (.*)$/gm,"<h3>$1</h3>")
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/^\- (.*)$/gm,"• $1")
    .replace(/(https?:\/\/[^\s<)]+)/g,'<a href="$1" target="_blank">$1</a>')
    .replace(/\n/g,"<br>");
}
async function visao(){
  try{
    const [m,q]=await Promise.all([
      fetch(`${RAW}/cloud/metrics.json?t=${Date.now()}`).then(r=>r.json()),
      fetch(`${RAW}/cloud/queue.json?t=${Date.now()}`).then(r=>r.json())
    ]);
    const pend=q.filter(x=>x.status==="pending").sort((a,b)=>a.when.localeCompare(b.when));
    const err=q.filter(x=>x.status==="error");
    const pub=q.filter(x=>x.status==="published");
    document.getElementById("hdr").textContent=`números de ${m.quando||"?"}`;
    const top=(m.top5&&m.top5[0])||{};
    let h=`<div class="north">
      <div class="stat"><div class="n gold">${m.seguidores??"?"}</div><div class="l">Seguidores ★</div></div>
      <div class="stat"><div class="n gold">${m.alcance_total??"?"}</div><div class="l">Alcance total ★</div></div>
      <div class="stat"><div class="n">${m.posts??"?"}</div><div class="l">Posts no ar</div></div>
      <div class="stat"><div class="n">${top.reach??"?"}</div><div class="l">Post vencedor</div></div>
    </div>`;
    h+=`<div class="card"><h2>☁️ Fila da nuvem — ${pend.length} agendado(s) · ${pub.length} publicados · ${err.length} erro(s)</h2>`;
    for(const it of pend.slice(0,6)){
      h+=`<div class="item"><span>${it.name.replace(/-/g," ")}</span><span class="q">${it.when.slice(5,16)}</span></div>`;
    }
    h+=`</div>`;
    if(err.length){ h+=`<div class="card"><h2 style="color:var(--warn)">⚠️ Erros</h2>`+err.map(e=>`<div class="item"><span>${e.name}</span><span>${(e.note||"").slice(0,60)}</span></div>`).join("")+`</div>`; }
    h+=`<div class="card"><h2>🤖 Frota (17 robôs) — toque para ver a última atividade</h2><div class="bots" id="bots">
      <span class="on" data-b="publish">publish</span><span class="on" data-b="report">report 8h</span><span class="on" data-b="comment">comment-bot</span><span class="on" data-b="refresh">refresh</span>
      <span class="on" data-b="dashboard">dashboard 8h34</span><span class="on" data-b="planilha">planilha 8h50</span><span class="on" data-b="trend">trend 7h30</span><span class="on" data-b="factory">factory</span>
      <span class="on" data-b="nudger">nudger</span><span class="on" data-b="analyst">analyst 21h30</span><span class="on" data-b="story">story 17h30</span><span class="on" data-b="leadcrm">lead-crm</span>
      <span class="on" data-b="pgbuilder">pg-builder</span><span class="on" data-b="kaizen">kaizen 22h</span><span class="on" data-b="pcagent">pc-agent</span><span data-b="threads">threads (chave)</span><span data-b="radar">radar (token FB)</span></div></div>`;
    document.getElementById("visao").innerHTML=h;
  }catch(e){ document.getElementById("visao").innerHTML=`<div class="loading">erro ao carregar: ${e.message}</div>`; }
}

const BOTS={
 publish:{n:"ig-publish",d:"Publica a fila no Instagram (+Threads) a cada 30min",wf:"ig-publish.yml",extra:"lastPub"},
 report:{n:"ig-report",d:"Relatorio diario 8h por e-mail (3 tentativas + anti-duplicata)",wf:"ig-report.yml",extra:"metrics"},
 comment:{n:"comment-bot",d:"Palavra-gatilho: resposta + DM (edite no Flows)",wf:"ig-comment.yml",extra:"botstate"},
 refresh:{n:"ig-refresh",d:"Renova o token do IG a cada 20 dias",wf:"ig-refresh.yml"},
 trend:{n:"trend-scout",d:"Pauta do dia 7h30 (Trends BR + G1 + roteiro do Professor PG)",wf:"ig-trend.yml",extra:"pauta"},
 factory:{n:"content-factory",d:"Renderiza estaticos/carrosseis na nuvem por spec",wf:"ig-factory.yml"},
 analyst:{n:"engagement-analyst",d:"Analise diaria 21h30; e-mail domingo/recorde",wf:"ig-analyst.yml",extra:"analysis"},
 story:{n:"story-poster",d:"Story do melhor post, todo dia 17h30",wf:"ig-story.yml",extra:"story"},
 radar:{n:"competitor-watch",d:"Radar dos perfis-referencia (dormente: aguarda token FB)",wf:"ig-competitor.yml"},
 leadcrm:{n:"lead-crm",d:"Registra todo lead (EU QUERO) em leads.csv",extra:"leads",static:"acoplado ao comment-bot"},
 dashboard:{n:"dashboard-agent",d:"Rotina Claude na nuvem, 8h34, atualiza o dashboard",static:"roda no claude.ai (rotinas) - resultado visivel no dashboard"},
 planilha:{n:"rotina-planilha",d:"Atualiza a planilha de controle as 8h50 (ou ao ligar o PC)",hb:"planilha"},
 nudger:{n:"publish-nudger",d:"Cutuca o publicador se o GitHub atrasar (20/20min, PC ligado)",hb:"nudger"},
 pgbuilder:{n:"pg-builder",d:"Monta o reel do Professor PG a partir da inbox (30/30min, PC)",hb:"pg-builder"},
 kaizen:{n:"agente-kaizen",d:"Ciclo kaizen 22h: evidencia vira registro (positiva/negativa/lean)",wf:"ig-kaizen.yml",extra:"kaizen"},
 pcagent:{n:"pc-agent",d:"Ponte web->PC: executa os robos locais que voce dispara aqui",static:"roda no seu PC a cada 3 min (tarefa do Windows)"},
 threads:{n:"threads-mirror",d:"Espelha cada post no Threads",static:"DORMENTE - aguardando a chave secreta do Threads"}
};
const fmtBR=iso=>{try{return new Date(iso).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}catch(e){return iso}};
function row(k,v,cls){return `<div class="mrow"><span class="k">${k}</span><span class="v ${cls||""}">${v}</span></div>`}

const TRIG={
 publish:{path:"cloud/posts/nudge.txt",label:"publicar a fila vencida agora"},
 report:{path:"cloud/report_nudge.txt",label:"gerar o relatorio agora"},
 trend:{path:"cloud/trend_nudge.txt",label:"gerar a pauta agora"},
 analyst:{path:"cloud/analyst_nudge.txt",label:"rodar a analise agora"},
 story:{path:"cloud/story_nudge.txt",label:"postar o story de hoje agora"},
 comment:{recommit:"cloud/flows.json",label:"varrer comentarios agora"},
 leadcrm:{recommit:"cloud/flows.json",wf:"ig-comment.yml",label:"varrer e registrar leads agora"},
 refresh:{path:"cloud/refresh_nudge.txt",label:"renovar o token agora"},
 factory:{path:"factory/nudge.txt",label:"processar as specs pendentes agora"},
 kaizen:{path:"cloud/kaizen_nudge.txt",label:"rodar o ciclo kaizen agora"},
 radar:{path:"cloud/competitor_nudge.txt",label:"espiar os perfis do radar agora"},
 planilha:{local:"planilha",label:"atualizar a planilha agora"},
 nudger:{local:"nudger",label:"checar a fila e cutucar agora"},
 pgbuilder:{local:"pg-builder",label:"montar o reel da inbox agora"}
};
const NOTRIG={
 dashboard:"a republicacao do dashboard so a rotina do Claude faz (8h34) - mas os numeros dela voce ja ve aqui na aba Visao, ao vivo",
 threads:"espelha junto com cada publicacao - dispare o ig-publish"
};
function appTok(){return (localStorage.getItem("pg_pat")||"").replace(/[^\x21-\x7E]/g,"")}

async function antecipar(btn){
  const tok=appTok();
  if(!tok){btn.textContent="configure o token na aba Flows";return}
  try{ if(window.Notification&&Notification.permission==="default")Notification.requestPermission(); }catch(e){}
  btn.disabled=true; btn.textContent="preparando...";
  try{
    const r0=await gh(`${API}/contents/cloud/queue.json?t=${Date.now()}`).then(x=>x.json());
    const q=JSON.parse(decodeURIComponent(escape(atob(r0.content.replace(/\n/g,"")))));
    const pend=q.filter(x=>x.status==="pending").sort((a,b)=>a.when.localeCompare(b.when));
    if(!pend.length){ btn.textContent="fila vazia \u2014 nada para antecipar"; btn.disabled=false; return; }
    const alvo=pend[0];
    const d=new Date(Date.now()-60000);
    const pad=n=>String(n).padStart(2,"0");
    const agora=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    alvo.when=agora;
    const antes=q.filter(x=>x.status==="published").length;
    window.__pubAntes=antes;
    let baseId=null;
    try{ const rb=await gh(`${API}/actions/workflows/ig-publish.yml/runs?per_page=1&t=${Date.now()}`).then(x=>x.json()); baseId=((rb.workflow_runs||[])[0]||{}).id||null; }catch(e){}
    const body={message:`antecipar publicacao: ${alvo.name} (PG Central)`,
      content:btoa(unescape(encodeURIComponent(JSON.stringify(q,null,1)))), sha:r0.sha};
    const rr=await fetch(`${API}/contents/cloud/queue.json`,{method:"PUT",
      headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!rr.ok){const e=await rr.json().catch(()=>({}));throw new Error(e.message||("HTTP "+rr.status))}
    btn.textContent=`\u23F3 antecipando "${alvo.name.replace(/-/g," ").slice(0,28)}"...`;
    watchRun("publish","ig-publish.yml",baseId,btn);
  }catch(e){ btn.disabled=false; btn.textContent="erro: "+e.message.slice(0,40); }
}

async function fire(id,btn){
  const t=TRIG[id]; const tok=appTok(); const bot=BOTS[id];
  if(!tok){btn.textContent="configure o token na aba Flows (Configurar acesso)";return}
  try{ if(window.Notification&&Notification.permission==="default")Notification.requestPermission(); }catch(e){}
  btn.disabled=true;btn.textContent="disparando...";
  let baseId=null;
  const wfBase=(t&&t.wf)||bot.wf;
  if(wfBase){ try{ const rb=await gh(`${API}/actions/workflows/${wfBase}/runs?per_page=1&t=${Date.now()}`).then(x=>x.json()); baseId=((rb.workflow_runs||[])[0]||{}).id||null; }catch(e){} }
  const hdr={Authorization:"Bearer "+tok,"Content-Type":"application/json"};
  try{
    const path=t.local?`requests/${t.local}.json`:(t.path||t.recommit);
    const url=`${API}/contents/${path}`;
    let sha=null,content=null;
    const r0=await fetch(`${url}?t=${Date.now()}`,{headers:{Authorization:"Bearer "+tok}});
    if(r0.ok){const j=await r0.json();sha=j.sha;content=j.content}
    const body={message:`disparo manual via PG Central: ${id}`};
    if(t.local){ body.content=btoa(JSON.stringify({quando:new Date().toISOString(),origem:"PG Central"})); }
    else if(t.recommit){ if(!content)throw new Error("arquivo nao encontrado"); body.content=content.replace(/\n/g,""); }
    else{ body.content=btoa("fire "+new Date().toISOString()); }
    if(sha)body.sha=sha;
    const r=await fetch(url,{method:"PUT",headers:hdr,body:JSON.stringify(body)});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||("HTTP "+r.status))}
    const wfAlvo=t.wf||bot.wf;
    if(t.local){ btn.textContent="\u23F3 pedido enviado \u2014 aguardando o PC..."; watchLocal(id,t.local,btn); }
    else if(wfAlvo){ btn.textContent="\u23F3 disparado \u2014 aguardando o rob\u00f4..."; watchRun(id,wfAlvo,baseId,btn); }
    else { btn.textContent="\u2713 disparado!"; btn.disabled=false; }
  }catch(e){btn.disabled=false;btn.textContent="erro: "+e.message.slice(0,40)}
}


function gh(u){const t=appTok();return fetch(u,t?{headers:{Authorization:"Bearer "+t}}:{})}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function notify(titulo,corpo){
  try{ if(navigator.vibrate)navigator.vibrate([120,60,120]); }catch(e){}
  try{ if(window.Notification&&Notification.permission==="granted"){new Notification(titulo,{body:corpo,icon:"icon-192.png"})} }catch(e){}
}

async function watchLocal(id,hbName,btn){
  const t0=Date.now();
  let antes=null;
  try{ antes=await fetch(`${RAW}/heartbeats/${hbName}.json?t=${Date.now()}`).then(x=>x.ok?x.json():null); }catch(e){}
  const marca=antes?antes.quando:null;
  for(let i=0;i<50;i++){
    await sleep(7000);
    try{
      const hbNow=await fetch(`${RAW}/heartbeats/${hbName}.json?t=${Date.now()}`).then(x=>x.ok?x.json():null);
      if(hbNow&&hbNow.quando!==marca){
        btn.textContent="\u2713 CONCLU\u00cdDO \u2014 "+(hbNow.resultado||"").replace("[disparo pelo app] ","").slice(0,60);
        btn.style.background="var(--ok)"; btn.style.color="#0b2a16"; btn.disabled=false;
        btn.onclick=()=>botInfo(id);
        notify(`${BOTS[id].n}: conclu\u00eddo \u2713`, hbNow.resultado||"");
        return;
      }
    }catch(e){}
    btn.textContent=`\u25B6\uFE0F o PC pega o pedido em at\u00e9 3 min... ${Math.round((Date.now()-t0)/1000)}s`;
  }
  btn.textContent="\u231B sem resposta do PC \u2014 ele est\u00e1 ligado?";
  btn.disabled=false;
}

async function watchRun(id,wf,baseId,btn){
  const t0=Date.now(); let runId=null;
  for(let i=0;i<70;i++){
    await sleep(6000);
    try{
      const r=await gh(`${API}/actions/workflows/${wf}/runs?per_page=1&t=${Date.now()}`).then(x=>x.json());
      const run=(r.workflow_runs||[])[0];
      if(!run) continue;
      if(!runId){
        if(baseId&&run.id===baseId){ btn.textContent="\u23F3 na fila do GitHub..."; continue; }
        runId=run.id;
      }
      if(run.status!=="completed"){
        btn.textContent=`\u25B6\uFE0F executando... ${Math.round((Date.now()-t0)/1000)}s`;
        continue;
      }
      const ok=run.conclusion==="success";
      const secs=Math.max(1,Math.round((new Date(run.updated_at)-new Date(run.run_started_at||run.created_at))/1000));
      let extraMsg="";
      if(id==="publish"&&ok){
        try{
          const q2=await fetch(`${RAW}/cloud/queue.json?t=${Date.now()}`).then(x=>x.json());
          const dep=q2.filter(x=>x.status==="published").length;
          const dif=dep-(window.__pubAntes||dep);
          extraMsg=dif>0?` \u2014 ${dif} post(s) publicado(s)!`:" \u2014 nada estava vencido (fila em dia)";
        }catch(e){}
      }
      btn.textContent=(ok?"\u2713 CONCLU\u00cdDO":"\u2717 FALHOU")+` em ${secs}s`+(extraMsg||" \u2014 toque para ver o resultado");
      btn.style.background=ok?"var(--ok)":"var(--warn)";
      btn.style.color=ok?"#0b2a16":"#fff";
      btn.disabled=false;
      btn.onclick=()=>botInfo(id);
      notify(`${BOTS[id].n}: ${ok?"conclu\u00eddo \u2713":"falhou \u2717"}`, ok?`terminou em ${secs}s`:"veja o andon no e-mail");
      return;
    }catch(e){}
  }
  btn.textContent="\u231B demorou mais que o esperado \u2014 reabra a ficha";
  btn.disabled=false;
}

async function botInfo(id){
  const b=BOTS[id]; const box=document.getElementById("mbox");
  box.innerHTML=`<h3>\u{1F916} ${b.n}</h3><div class="desc">${b.d}</div><div class="loading">consultando...</div>`;
  document.getElementById("mbg").classList.add("on");
  let h="";
  try{
    if(b.wf){
      const r=await gh(`${API}/actions/workflows/${b.wf}/runs?per_page=1&t=${Date.now()}`).then(x=>x.json());
      const run=(r.workflow_runs||[])[0];
      if(run){
        h+=row("Ultima execucao",fmtBR(run.created_at),"gold");
        h+=row("Resultado",run.conclusion==="success"?"\u2713 sucesso":(run.conclusion||run.status),run.conclusion==="success"?"ok":"bad");
        h+=row("Disparo",run.event==="schedule"?"\u23F0 agendado":run.event==="push"?"\u26A1 manual/nudge":run.event);
      } else h+=row("Execucoes","nenhuma ainda");
    }
    if(b.hb){
      try{const hb=await fetch(`${RAW}/heartbeats/${b.hb}.json?t=${Date.now()}`).then(x=>{if(!x.ok)throw 0;return x.json()});
        h+=row("Ultima atividade",fmtBR(hb.quando),"gold")+row("Resultado",hb.resultado,"ok");
      }catch(e){h+=row("Ultima atividade","ainda sem registro (1o batimento em breve)")}
    }
    if(b.extra==="lastPub"){
      const q=await fetch(`${RAW}/cloud/queue.json?t=${Date.now()}`).then(x=>x.json());
      const pubs=q.filter(x=>x.status==="published"&&x.published_at).sort((a,b)=>b.published_at.localeCompare(a.published_at));
      if(pubs[0]) h+=row("Ultimo post publicado",`${pubs[0].name.replace(/-/g," ")}<br>as ${pubs[0].published_at.slice(11)}`,"ok");
      const pend=q.filter(x=>x.status==="pending").sort((a,b)=>a.when.localeCompare(b.when));
      const agora=new Date(); const venc=pend.filter(x=>new Date(x.when.replace(" ","T"))<=agora);
      h+=row("Vencidos agora",venc.length?`${venc.length} \u2014 disparar publica`:"nenhum",venc.length?"gold":"");
      if(pend[0]) h+=row("Proximo post",`${pend[0].name.replace(/-/g," ")}<br>${pend[0].when.slice(5,16)}`,"");
      window.__pubAntes=q.filter(x=>x.status==="published").length;
      const err=q.filter(x=>x.status==="error"); if(err.length) h+=row("Erros na fila",err.length,"bad");
    }
    if(b.extra==="kaizen"){
      const kz=await fetch(`${RAW}/cloud/kaizen.json?t=${Date.now()}`).then(x=>x.ok?x.json():{entradas:[]});
      const ent=kz.entradas||[]; const abertas=ent.filter(e=>e.status==="Aberta");
      h+=row("Registros no ciclo",ent.length,"gold")+row("Impedimentos abertos",abertas.length,abertas.length?"bad":"ok");
      if(ent.length) h+=row("Ultimo registro",ent[ent.length-1].titulo,"ok");
    }
    if(b.extra==="metrics"){
      const m=await fetch(`${RAW}/cloud/metrics.json?t=${Date.now()}`).then(x=>x.json());
      h+=row("Numeros coletados em",m.quando,"ok")+row("Snapshot",`${m.seguidores} seguidor(es) \u00B7 ${m.alcance_total} alcance`);
    }
    if(b.extra==="botstate"){
      const st=await fetch(`${RAW}/cloud/bot_state.json?t=${Date.now()}`).then(x=>x.json());
      h+=row("Comentarios processados",(st.processed||[]).length,(st.processed||[]).length?"ok":"");
      h+=row("Obs","0 = modo dev esconde comentarios (falta testador/Live)");
    }
    if(b.extra==="pauta"){
      const is=await gh(`${API}/issues?state=all&per_page=10`).then(x=>x.json());
      const p=(is||[]).find(i=>i.title.startsWith("\u{1F5DE}"));
      if(p) h+=row("Ultima pauta",p.title,"ok");
    }
    if(b.extra==="analysis"){
      const a=await fetch(`${RAW}/cloud/analysis.json?t=${Date.now()}`).then(x=>x.json());
      const dias=Object.keys(a.dias||{}).sort(); const ult=dias[dias.length-1];
      h+=row("Ultimo snapshot",ult,"ok")+row("Recorde de alcance",a.recorde,"gold");
    }
    if(b.extra==="story"){
      const st=await fetch(`${RAW}/cloud/story_state.json?t=${Date.now()}`).then(x=>x.json());
      h+=row("Ultimo story",st.last_date||"-",st.last_date?"ok":"")+row("ID",st.last_story||"-");
    }
    if(b.extra==="leads"){
      try{const csv=await fetch(`${RAW}/cloud/leads.csv?t=${Date.now()}`).then(x=>{if(!x.ok)throw 0;return x.text()});
        const lines=csv.trim().split("\n").slice(1);
        h+=row("Leads registrados",lines.length,lines.length?"gold":"");
        if(lines.length){const u=lines[lines.length-1].split(";");h+=row("Ultimo lead",`@${u[2]} (${u[1]})`,"ok")}
      }catch(e){h+=row("Leads registrados","0 (o funil abre com o 1o EU QUERO visivel)")}
    }
    if(b.static) h+=row("Estado",b.static);
  }catch(e){ h+=row("Erro",e.message,"bad"); }
  let fireHtml="";
  if(TRIG[id]){ fireHtml=`<button class="mfire" style="background:var(--gold);color:#261442" onclick="fire('${id}',this)">\u26A1 Disparar agora \u2014 ${TRIG[id].label}</button>`;
    if(id==="publish") fireHtml+=`<button class="mfire" style="background:var(--lav);color:#fff" onclick="antecipar(this)">\u23E9 Publicar o PR\u00d3XIMO agora (antecipar)</button><div class="mnote">antecipa o pr\u00f3ximo item da fila para este minuto \u2014 o hor\u00e1rio original \u00e9 substitu\u00eddo</div>`;
    if(TRIG[id].local) fireHtml+=`<div class="mnote">roda no seu PC \u2014 precisa estar ligado (o pc-agent busca pedidos a cada 3 min)</div>`; }
  else if(NOTRIG[id]) fireHtml=`<div class="mnote">${NOTRIG[id]}</div>`;
  box.innerHTML=`<h3>\u{1F916} ${b.n}</h3><div class="desc">${b.d}</div>${h}${fireHtml}<button class="mclose" onclick="document.getElementById('mbg').classList.remove('on')">fechar</button>`;
}

async function diario(){
  try{
    const is=await gh(`${API}/issues?state=all&per_page=12&sort=created&direction=desc`).then(r=>r.json());
    const vistos=new Set(); const picks=[];
    for(const i of is){
      const tipo=i.title.startsWith("🗞️")?"pauta":i.title.startsWith("📰")?"relatorio":i.title.startsWith("📈")?"analise":i.title.startsWith("🦫")?"roteiro":null;
      if(tipo && !vistos.has(tipo)){ vistos.add(tipo); picks.push(i); }
    }
    document.getElementById("diario").innerHTML = picks.length
      ? picks.map(i=>`<div class="issue"><h3>${i.title}</h3>${md(i.body||"")}</div>`).join("")
      : '<div class="loading">nenhuma edição ainda — a pauta sai 7h30, o relatório 8h</div>';
  }catch(e){ document.getElementById("diario").innerHTML=`<div class="loading">erro: ${e.message}</div>`; }
}
visao().then(()=>{const el=document.getElementById("bots");if(el)el.addEventListener("click",e=>{const t=e.target.closest("[data-b]");if(t)botInfo(t.dataset.b)})}); diario();
</script>
