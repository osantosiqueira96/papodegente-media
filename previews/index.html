<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Previews — fila @papodegentebr</title>
<style>
:root{--bg0:#150925;--bg1:#241042;--card:#2b1550;--card2:#231043;--line:#3d2266;--ink:#F3EDFA;--ink2:#B8A6D9;--lav:#A374FF;--gold:#FFD100;--ok:#4ade80;--warn:#f87171}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(120% 80% at 20% 0%,var(--bg1),var(--bg0) 70%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:26px 16px 80px}
.wrap{max-width:1080px;margin:0 auto}
.eyebrow{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--lav);font-weight:700}
h1{font-size:clamp(24px,5vw,36px);font-weight:900;text-transform:uppercase;margin:4px 0 2px}
h1 .pg{background:var(--gold);color:#261442;border-radius:10px;padding:2px 12px;display:inline-block}
.sub{color:var(--ink2);font-size:13px;margin-bottom:20px}
.day{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:800;margin:26px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.media{width:100%;aspect-ratio:4/5;object-fit:cover;background:#0d0618;display:block}
video.media{aspect-ratio:9/16;max-height:420px}
.meta{padding:10px 12px 12px}
.nome{font-size:12.5px;font-weight:700;line-height:1.3}
.hora{font-family:ui-monospace,monospace;font-size:12px;color:var(--gold);margin-top:2px}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:6px;margin-top:6px}
.tag.reel{background:rgba(163,116,255,.2);color:var(--lav)}
.tag.photo{background:rgba(255,209,0,.15);color:var(--gold)}
.tag.carousel{background:rgba(96,165,250,.15);color:#60a5fa}
.tag.pub{background:rgba(74,222,128,.15);color:var(--ok)}
.tag.err{background:rgba(248,113,113,.18);color:var(--warn)}
.cap{font-size:11px;color:var(--ink2);margin-top:8px;max-height:60px;overflow:hidden;white-space:pre-line}
.empty{color:var(--ink2);padding:30px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">SS Dark · fila de publicação ao vivo</div>
  <h1><span class="pg">PG</span> Previews</h1>
  <div class="sub" id="resumo">carregando a fila da nuvem...</div>
  <div id="lista"></div>
</div>
<script>
const RAW="https://raw.githubusercontent.com/osantosiqueira96/papodegente-media/main";
const DIAS=["dom","seg","ter","qua","qui","sex","sáb"];
function fdata(w){ const d=new Date(w.replace(" ","T")); return `${DIAS[d.getDay()]} ${w.slice(8,10)}/${w.slice(5,7)}`; }
async function cap(name,el){
  try{ const r=await fetch(`${RAW}/cloud/posts/${name}/legenda.txt?t=${Date.now()}`); if(r.ok){ el.textContent=(await r.text()).split("\n")[0]; } }catch(e){}
}
function media(name,type){
  if(type==="reel"){
    const v=document.createElement("video");
    v.className="media"; v.controls=true; v.preload="none"; v.muted=false; v.playsInline=true;
    v.src=`${RAW}/cloud/posts/${name}/REEL_pronto.mp4`;
    v.onerror=()=>{ const i=document.createElement("img"); i.className="media"; i.src=`${RAW}/cloud/posts/${name}/slide1.jpg`; v.replaceWith(i); };
    return v;
  }
  const i=document.createElement("img");
  i.className="media"; i.loading="lazy";
  i.src=`${RAW}/cloud/posts/${name}/slide1.jpg`;
  return i;
}
async function go(){
  const r=await fetch(`${RAW}/cloud/queue.json?t=${Date.now()}`);
  const q=await r.json();
  const pend=q.filter(x=>x.status==="pending").sort((a,b)=>a.when.localeCompare(b.when));
  const pub=q.filter(x=>x.status==="published").length;
  const err=q.filter(x=>x.status==="error").length;
  document.getElementById("resumo").textContent=`${pend.length} agendado(s) · ${pub} publicado(s) · ${err} erro(s) — página sempre atual (lê a fila ao vivo)`;
  const box=document.getElementById("lista");
  if(!pend.length){ box.innerHTML='<div class="empty">fila vazia — nada agendado</div>'; return; }
  let dia="";
  let grid=null;
  for(const it of pend){
    const d=it.when.slice(0,10);
    if(d!==dia){ dia=d;
      const h=document.createElement("div"); h.className="day"; h.textContent=fdata(it.when); box.appendChild(h);
      grid=document.createElement("div"); grid.className="grid"; box.appendChild(grid);
    }
    const c=document.createElement("div"); c.className="card";
    c.appendChild(media(it.name,it.type));
    const m=document.createElement("div"); m.className="meta";
    m.innerHTML=`<div class="nome">${it.name.replace(/-/g," ").replace(/\s+/g," ")}</div>
      <div class="hora">🕐 ${it.when.slice(11)}</div>
      <span class="tag ${it.type}">${it.type==="reel"?"🎬 reel":it.type==="photo"?"🖼 estático":"🎠 carrossel"}</span>
      <div class="cap">carregando legenda...</div>`;
    c.appendChild(m); grid.appendChild(c);
    cap(it.name, m.querySelector(".cap"));
  }
}
go();
</script>
</body>
</html>
