<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feed — @papodegentebr</title>
<style>
:root{--bg0:#150925;--bg1:#241042;--card:#2b1550;--card2:#231043;--line:#3d2266;--ink:#F3EDFA;--ink2:#B8A6D9;--lav:#A374FF;--gold:#FFD100;--ok:#4ade80;--warn:#f87171}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(120% 80% at 20% 0%,var(--bg1),var(--bg0) 70%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:18px 12px 70px}
.wrap{max-width:760px;margin:0 auto}
.eyebrow{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--lav);font-weight:700}
h1{font-size:clamp(20px,4.5vw,30px);font-weight:900;text-transform:uppercase;margin:3px 0 2px}
h1 .pg{background:var(--gold);color:#261442;border-radius:9px;padding:1px 10px;display:inline-block}
.sub{color:var(--ink2);font-size:12.5px;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--ink2);border-radius:11px;padding:8px;font-size:12px;font-weight:800;cursor:pointer}
.tabs button.on{background:var(--gold);color:#261442;border-color:var(--gold)}
.view{display:none}.view.on{display:block}
/* ---- FEED (grade do perfil, 3 colunas 3:4 como o Instagram) ---- */
.phone{background:#0d0618;border:1px solid var(--line);border-radius:18px;padding:12px 10px 14px;max-width:430px;margin:0 auto}
.bio{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ava{width:56px;height:56px;border-radius:99px;background:linear-gradient(135deg,#7C3AED,#4C1D95);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--gold);font-size:19px;flex:none}
.bio .nome{font-size:13.5px;font-weight:800}
.bio .desc{font-size:11px;color:var(--ink2);line-height:1.35}
.nums{display:flex;gap:16px;margin:2px 0 4px;font-size:11px;color:var(--ink2)}
.nums b{color:var(--ink);font-size:13px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.cel{position:relative;aspect-ratio:3/4;background:#150925;overflow:hidden;cursor:pointer}
.cel img,.cel video{width:100%;height:100%;object-fit:cover;display:block}
.cel .ic{position:absolute;top:5px;right:5px;font-size:12px;filter:drop-shadow(0 1px 2px #000)}
.cel .fut{position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,9,37,.15),rgba(21,9,37,.85));display:flex;flex-direction:column;justify-content:flex-end;padding:5px}
.cel .fut b{font-size:10px;color:var(--gold);font-family:ui-monospace,monospace}
.cel.pub{outline:2px solid rgba(74,222,128,.35);outline-offset:-2px}
.legenda{margin-top:12px;font-size:11.5px;color:var(--ink2);text-align:center}
.legenda span{display:inline-block;margin:0 6px}
/* ---- AGENDA ---- */
.day{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:800;margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.media{width:100%;aspect-ratio:4/5;object-fit:cover;background:#0d0618;display:block}
video.media{aspect-ratio:9/16;max-height:380px}
.meta{padding:9px 11px 11px}
.nome2{font-size:12px;font-weight:700;line-height:1.3}
.hora{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--gold);margin-top:2px}
.tag{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:6px;margin-top:5px}
.tag.reel{background:rgba(163,116,255,.2);color:var(--lav)}
.tag.photo{background:rgba(255,209,0,.15);color:var(--gold)}
.tag.carousel{background:rgba(96,165,250,.15);color:#60a5fa}
.cap{font-size:10.5px;color:var(--ink2);margin-top:7px;max-height:48px;overflow:hidden}
.loading{color:var(--ink2);text-align:center;padding:36px;font-size:13px}
/* ---- modal ---- */
.mbg{position:fixed;inset:0;background:rgba(10,4,24,.82);backdrop-filter:blur(3px);display:none;z-index:40;align-items:center;justify-content:center;padding:16px}
.mbg.on{display:flex}
.mb{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:340px;width:100%;overflow:hidden;max-height:88vh;overflow-y:auto}
.mb .mm{width:100%;display:block;background:#0d0618}
.mb .mtxt{padding:13px}
.mb h3{font-size:13.5px;color:var(--gold);margin-bottom:3px}
.mb .q{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--ink2)}
.mb p{font-size:12px;color:var(--ink2);margin-top:9px;white-space:pre-line;line-height:1.45}
.mb button{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--ink2);padding:10px;font-weight:800;cursor:pointer;border-radius:0 0 16px 16px}
.voltar{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);color:var(--lav);border-radius:99px;padding:6px 14px;font-size:12px;font-weight:800;text-decoration:none;margin-bottom:12px}
.voltar:hover{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <a class="voltar" href="../app/" id="btvoltar">‹ PG Central</a>
  <div class="eyebrow">SS Dark · como o perfil vai ficar</div>
  <h1><span class="pg">PG</span> Previews</h1>
  <div class="sub" id="resumo">carregando a fila da nuvem...</div>

  <div class="tabs">
    <button class="on" data-v="feed">📱 Feed do perfil</button>
    <button data-v="agenda">📅 Agenda</button>
  </div>

  <div class="view on" id="v-feed">
    <div class="phone">
      <div class="bio">
        <div class="ava">PG</div>
        <div>
          <div class="nome">papodegentebr</div>
          <div class="desc">papo de gente | dinheiro no dia a dia<br>dinheiro, política e tecnologia pra vida real</div>
        </div>
      </div>
      <div class="nums" id="nums"></div>
      <div class="grade" id="grade"></div>
      <div class="legenda">
        <span style="color:var(--ok)">▣ borda verde = já publicado</span>
        <span>🕐 escurecido = agendado</span>
      </div>
    </div>
  </div>

  <div class="view" id="v-agenda"><div class="loading">carregando...</div></div>
</div>
<div class="mbg" id="mbg" onclick="if(event.target===this)this.classList.remove('on')"><div class="mb" id="mb"></div></div>
<script>
const RAW="https://raw.githubusercontent.com/osantosiqueira96/papodegente-media/main";
const DIAS=["dom","seg","ter","qua","qui","sex","sáb"];
let QUEUE=[], CAPS={};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); document.getElementById("v-"+b.dataset.v).classList.add("on");
});
function fdata(w){ const d=new Date(w.replace(" ","T")); return `${DIAS[d.getDay()]} ${w.slice(8,10)}/${w.slice(5,7)}`; }
function thumbSrc(it){
  return it.type==="reel" ? `${RAW}/cloud/posts/${it.name}/REEL_pronto.mp4#t=1`
                          : `${RAW}/cloud/posts/${it.name}/slide1.jpg`;
}
function thumb(it){
  if(it.type==="reel"){
    const v=document.createElement("video");
    v.src=thumbSrc(it); v.muted=true; v.playsInline=true; v.preload="metadata";
    return v;
  }
  const i=document.createElement("img"); i.loading="lazy"; i.src=thumbSrc(it); return i;
}
async function cap(name){
  if(CAPS[name]!==undefined) return CAPS[name];
  try{ const r=await fetch(`${RAW}/cloud/posts/${name}/legenda.txt?t=${Date.now()}`);
       CAPS[name]=r.ok?await r.text():""; }catch(e){ CAPS[name]=""; }
  return CAPS[name];
}
async function abrir(it){
  const mb=document.getElementById("mb");
  const publicado=it.status==="published";
  mb.innerHTML=`<div class="mtxt"><h3>${it.name.replace(/-/g," ")}</h3>
    <div class="q">${publicado?"✅ publicado "+(it.published_at||"").slice(5):"🕐 agenda "+it.when.slice(5,16)} · ${it.type}</div>
    <p>carregando legenda...</p></div><button onclick="document.getElementById('mbg').classList.remove('on')">fechar</button>`;
  document.getElementById("mbg").classList.add("on");
  const media = it.type==="reel"
    ? `<video class="mm" src="${RAW}/cloud/posts/${it.name}/REEL_pronto.mp4" controls playsinline></video>`
    : `<img class="mm" src="${RAW}/cloud/posts/${it.name}/slide1.jpg">`;
  const texto=await cap(it.name);
  mb.innerHTML=`${media}<div class="mtxt"><h3>${it.name.replace(/-/g," ")}</h3>
    <div class="q">${publicado?"✅ publicado "+(it.published_at||"").slice(5):"🕐 agenda "+it.when.slice(5,16)} · ${it.type}</div>
    <p>${(texto||"(sem legenda)").replace(/</g,"&lt;")}</p></div>
    <button onclick="document.getElementById('mbg').classList.remove('on')">fechar</button>`;
}
function montarFeed(){
  // feed do Instagram: mais recente primeiro (o futuro entra no topo)
  const ordem=[...QUEUE].sort((a,b)=>(b.published_at||b.when).localeCompare(a.published_at||a.when));
  const g=document.getElementById("grade"); g.innerHTML="";
  const pub=QUEUE.filter(x=>x.status==="published").length;
  const pend=QUEUE.filter(x=>x.status==="pending").length;
  document.getElementById("nums").innerHTML=
    `<span><b>${pub+pend}</b> posts</span><span><b>${pend}</b> na fila</span><span><b>${pub}</b> no ar</span>`;
  for(const it of ordem){
    const c=document.createElement("div");
    c.className="cel"+(it.status==="published"?" pub":"");
    c.appendChild(thumb(it));
    const ic=document.createElement("div"); ic.className="ic";
    ic.textContent=it.type==="reel"?"🎬":it.type==="carousel"?"🎠":"";
    c.appendChild(ic);
    if(it.status!=="published"){
      const f=document.createElement("div"); f.className="fut";
      f.innerHTML=`<b>🕐 ${it.when.slice(8,10)}/${it.when.slice(5,7)} ${it.when.slice(11)}</b>`;
      c.appendChild(f);
    }
    c.onclick=()=>abrir(it);
    g.appendChild(c);
  }
}
async function montarAgenda(){
  const box=document.getElementById("v-agenda"); box.innerHTML="";
  const pend=QUEUE.filter(x=>x.status==="pending").sort((a,b)=>a.when.localeCompare(b.when));
  if(!pend.length){ box.innerHTML='<div class="loading">fila vazia — nada agendado</div>'; return; }
  let dia="", grid=null;
  for(const it of pend){
    if(it.when.slice(0,10)!==dia){
      dia=it.when.slice(0,10);
      const h=document.createElement("div"); h.className="day"; h.textContent=fdata(it.when); box.appendChild(h);
      grid=document.createElement("div"); grid.className="grid"; box.appendChild(grid);
    }
    const c=document.createElement("div"); c.className="card";
    const m=thumb(it); m.className="media"; if(it.type==="reel"){m.controls=true;m.muted=false;}
    c.appendChild(m);
    const meta=document.createElement("div"); meta.className="meta";
    meta.innerHTML=`<div class="nome2">${it.name.replace(/-/g," ")}</div>
      <div class="hora">🕐 ${it.when.slice(11)}</div>
      <span class="tag ${it.type}">${it.type==="reel"?"🎬 reel":it.type==="photo"?"🖼 estático":"🎠 carrossel"}</span>
      <div class="cap">carregando...</div>`;
    c.appendChild(meta); grid.appendChild(c);
    cap(it.name).then(t=>{ meta.querySelector(".cap").textContent=(t||"").split("\n")[0]; });
  }
}
async function go(){
  const r=await fetch(`${RAW}/cloud/queue.json?t=${Date.now()}`);
  QUEUE=await r.json();
  const pend=QUEUE.filter(x=>x.status==="pending").length;
  const pub=QUEUE.filter(x=>x.status==="published").length;
  const err=QUEUE.filter(x=>x.status==="error").length;
  document.getElementById("resumo").textContent=
    `${pend} agendado(s) · ${pub} publicado(s)${err?" · "+err+" erro(s)":""} — assim o feed vai ficar quando tudo for ao ar`;
  montarFeed(); montarAgenda();
}
go();
</script>
<script>if(window.self!==window.top){var b=document.getElementById("btvoltar");if(b)b.style.display="none";}</script>
</body>
</html>
